plugins {
    id 'java'
}

group = "net.bdew.wurm"
version = "1.5.0"

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://gotti.no-ip.org/maven/repository" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    implementation 'org.gotti.wurmunlimited:server-modlauncher:0.43'
    implementation 'com.github.bdew-wurm:bdew_server_mod_tools:876e2d7002'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

tasks.named('jar') {
    archiveFileName = "${project.name}.jar"
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
        )
    }
}

tasks.register('pack', Zip) {
    from fileTree(dir: 'pack', include: '**')
    destinationDirectory = file("build/pack")
    archiveFileName = "halloween-pack.zip"
}

tasks.register('dist', Zip) {
    into("mods") {
        into(project.name) {
            from jar
            from pack
        }
        from fileTree(dir: 'mods', include: '*')
    }
    archiveFileName = "${project.name}-${project.version}.zip"
}
